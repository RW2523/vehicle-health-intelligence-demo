# VehicleSense AI - full stack for the NVIDIA DGX Spark (linux/arm64) or any Docker host.
#
#   docker compose up -d --build                  # TimescaleDB + Mosquitto + API + web
#   docker compose --profile llm up -d --build    # ... plus Ollama on the GPU for the assistant/report LLM
#   open http://<host>:3000
#
# The API seeds the database from ./data/curated on first start (about 1-2 minutes) and keeps it in the "pgdata" volume.
name: vehiclesense

services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: vhi
      POSTGRES_PASSWORD: vhi
      POSTGRES_DB: vhi
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vhi -d vhi"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    volumes: [./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro]
    ports: ["1883:1883"]   # lane sensors / simulators can publish to lane/<lane_id>/<sensor>
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: app/backend/Dockerfile }
    depends_on:
      db: { condition: service_healthy }
      mqtt: { condition: service_started }
    environment:
      VHI_DATABASE_URL: postgresql+psycopg://vhi:vhi@db:5432/vhi
      VHI_MQTT_URL: mqtt://mqtt:1883
      VHI_OLLAMA_URL: ${VHI_OLLAMA_URL:-http://ollama:11434}   # unreachable = template engine (the demo still works)
      VHI_OLLAMA_MODEL: ${VHI_OLLAMA_MODEL:-qwen3:32b}
      VHI_PUBLIC_BASE_URL: ${VHI_PUBLIC_BASE_URL:-http://localhost:3000}   # used in report QR codes
      VHI_CORS_ORIGINS: ${VHI_CORS_ORIGINS:-*}
    volumes:
      - ./data/curated:/data:ro
      - vhivar:/var/lib/vhi
    ports: ["8000:8000"]   # the browser opens the live WebSocket on <host>:8000/ws
    restart: unless-stopped

  web:
    build: { context: app/web, args: { VHI_API_INTERNAL: "http://api:8000" } }
    depends_on:
      api: { condition: service_healthy }
    ports: ["3000:3000"]
    restart: unless-stopped

  ollama:
    profiles: ["llm"]
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
    restart: unless-stopped

volumes:
  pgdata:
  vhivar:
  ollama:
